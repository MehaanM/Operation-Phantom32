name: Feature request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or gap does this address?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What should Phantom32 do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you prefer this one.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Firmware feature
        - Security improvement
        - Testing / coverage
        - Documentation
        - CI / build system
        - Hardware compatibility
    validations:
      required: true

  - type: checkboxes
    id: responsible_use
    attributes:
      label: Responsible use
      options:
        - label: This feature is applicable to authorized security research / lab environments
          required: true
