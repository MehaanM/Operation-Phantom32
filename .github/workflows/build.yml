name: Phantom32 CI

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: minimal read-only permissions. Jobs that need more declare it explicitly.
permissions:
  contents: read

env:
  PIO_VERSION: "6.2.0"

jobs:
  # ----------------------------------------------------------------
  # Job 1a: Native unit tests (plain — fastest; fail here first)
  # ----------------------------------------------------------------
  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-native-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Install GCC (native build toolchain)
        run: sudo apt-get install -y --no-install-recommends gcc g++ make

      - name: Run unit tests
        run: |
          pio test -e native --verbose > test_output.txt 2>&1
          rc=$?
          cat test_output.txt
          result_lines=$(grep -cE ":(PASS|FAIL)" test_output.txt || true)
          echo "Individual test result lines: $result_lines"
          if [ "$result_lines" -eq 0 ]; then
            echo "ERROR: No test results found — did any tests execute?" >&2
            exit 1
          fi
          grep -E "[0-9]+ Tests [0-9]+ Failures" test_output.txt || true
          exit $rc

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-output-native
          path: test_output.txt
          retention-days: 7

  # ----------------------------------------------------------------
  # Job 1b: Sanitizer run (ASan + UBSan)
  # ----------------------------------------------------------------
  native-sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-asan-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: pio-asan-

      - name: Install PlatformIO + GCC
        run: |
          pip install "platformio==${{ env.PIO_VERSION }}"
          sudo apt-get install -y --no-install-recommends gcc g++ make

      - name: Run tests under AddressSanitizer + UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:print_stats=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          pio test -e native_asan --verbose 2>&1 | tee asan_output.txt
          rc=${PIPESTATUS[0]}
          result_lines=$(grep -cE ":(PASS|FAIL)" asan_output.txt || true)
          echo "Sanitizer test result lines: $result_lines"
          [ "$result_lines" -eq 0 ] && { echo "ERROR: Zero tests executed under sanitizers" >&2; exit 1; }
          exit $rc

      - name: Upload sanitizer output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-output-asan
          path: asan_output.txt
          retention-days: 7

  # ----------------------------------------------------------------
  # Job 1c: Coverage report (gcov / lcov) — enforced minimums
  # ----------------------------------------------------------------
  native-coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-cov-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: pio-cov-

      - name: Install PlatformIO + lcov
        run: |
          pip install "platformio==${{ env.PIO_VERSION }}"
          sudo apt-get install -y --no-install-recommends gcc g++ make lcov

      - name: Run tests with coverage instrumentation
        run: |
          export LDFLAGS="-lgcov"
          pio test -e native_cov --verbose

      - name: Generate coverage report
        run: |
          # Coverage measures src/ source files only. Test files are excluded because
          # Unity assertion macros generate two branches per assertion (pass/fail), but
          # the fail path is never reached in a passing suite — giving ~50% branch
          # coverage for each assertion with no actionable remediation. Measuring only
          # src/ gives a stable, meaningful signal for future regressions.
          lcov --capture \
               --directory .pio/build/native_cov/ \
               --output-file coverage.info \
               --ignore-errors mismatch,inconsistent,unsupported,deprecated \
               --rc branch_coverage=1 \
               2>/dev/null || true
          lcov --remove coverage.info \
               '/usr/*' \
               '*/.platformio/*' \
               '*/.pio/libdeps/*' \
               '*/.pio/build/unity_config/*' \
               '*/test/*' \
               --output-file coverage_filtered.info \
               --rc branch_coverage=1 \
               --ignore-errors deprecated,inconsistent,unsupported \
               2>/dev/null || true
          if [ -f coverage_filtered.info ]; then
            lcov --summary coverage_filtered.info --rc branch_coverage=1 --ignore-errors deprecated 2>/dev/null || true
            line_cov=$(lcov --summary coverage_filtered.info --rc branch_coverage=1 --ignore-errors deprecated 2>/dev/null \
                        | grep "lines" | grep -oE "[0-9]+\.[0-9]+" | head -1)
            branch_cov=$(lcov --summary coverage_filtered.info --rc branch_coverage=1 --ignore-errors deprecated 2>/dev/null \
                          | grep "branches" | grep -oE "[0-9]+\.[0-9]+" | head -1)
            echo "Line coverage:   ${line_cov}%  (minimum: 85%)"
            echo "Branch coverage: ${branch_cov}%  (minimum: 80%  [src/ files only; test files excluded])"
            failed=0
            if [ -n "$line_cov" ]; then
              under=$(echo "$line_cov < 85.0" | bc -l 2>/dev/null || echo 0)
              if [ "$under" = "1" ]; then
                echo "ERROR: Line coverage ${line_cov}% is below the 85% minimum." >&2
                failed=1
              fi
            else
              echo "ERROR: Could not parse line coverage." >&2
              failed=1
            fi
            if [ -n "$branch_cov" ]; then
              under=$(echo "$branch_cov < 80.0" | bc -l 2>/dev/null || echo 0)
              if [ "$under" = "1" ]; then
                echo "ERROR: Branch coverage ${branch_cov}% is below the 80% minimum." >&2
                failed=1
              fi
            else
              echo "ERROR: Could not parse branch coverage — no branch data in report." >&2
              failed=1
            fi
            if [ "$failed" = "1" ]; then exit 1; fi
          else
            echo "ERROR: Coverage data not generated." >&2
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: coverage*.info
          retention-days: 14

  # ----------------------------------------------------------------
  # Job 1d: Secret scanning (gitleaks)
  # ----------------------------------------------------------------
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # full history required for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ----------------------------------------------------------------
  # Job 1e: Dependency vulnerability scanning
  # ----------------------------------------------------------------
  dep-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install pip-audit and PlatformIO
        run: pip install pip-audit "platformio==${{ env.PIO_VERSION }}"

      - name: Audit CI security tools (must pass — no known CVEs expected)
        run: |
          echo "pip-audit" > /tmp/ci_security_tools.txt
          pip-audit --requirement /tmp/ci_security_tools.txt -f json \
            > pip_audit_tools.json
          echo "OK: No known vulnerabilities in CI security tooling."

      - name: Audit full PlatformIO dependency tree (findings logged, not gating)
        run: |
          pip-audit -f json > pip_audit_full.json || true
          echo "--- PlatformIO dependency vulnerability summary ---"
          python3 - <<'PYEOF'
          import json, sys
          try:
              data = json.load(open('pip_audit_full.json'))
          except (json.JSONDecodeError, FileNotFoundError) as e:
              print(f'WARNING: Could not parse audit output: {e}')
              sys.exit(0)
          if isinstance(data, list):
              deps = data
          elif isinstance(data, dict):
              deps = data.get('dependencies', data.get('results', []))
          else:
              deps = []
          vuln_pkgs = [d for d in deps if d.get('vulns')]
          if not vuln_pkgs:
              print('No vulnerabilities found in full dependency tree.')
          else:
              total = sum(len(d['vulns']) for d in vuln_pkgs)
              print(f'Found {total} known CVE(s) across {len(vuln_pkgs)} package(s):')
              for d in vuln_pkgs:
                  for v in d['vulns']:
                      ids = ', '.join(v.get('aliases', [v['id']]))
                      print(f"  {d['name']}=={d['version']}: {v['id']} ({ids})")
              print()
              print('See docs/dependency-inventory.md for risk assessment and tracking.')
          PYEOF

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pip-audit-report
          path: |
            pip_audit_tools.json
            pip_audit_full.json
          retention-days: 14

  # ----------------------------------------------------------------
  # Job 1f: SBOM generation (CycloneDX)
  # ----------------------------------------------------------------
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install SBOM tools
        run: pip install cyclonedx-bom "platformio==${{ env.PIO_VERSION }}"

      - name: Generate CycloneDX SBOM
        run: |
          # Generate SBOM for the Python/CI tooling environment.
          cyclonedx-py environment -o sbom-ci.json --format json 2>/dev/null || \
            python3 -c "
          import subprocess, json, datetime
          pkgs = subprocess.run(['pip', 'list', '--format=json'], capture_output=True, text=True)
          components = []
          for p in json.loads(pkgs.stdout):
              components.append({
                  'type': 'library',
                  'name': p['name'],
                  'version': p['version'],
                  'purl': f\"pkg:pypi/{p['name']}@{p['version']}\"
              })
          sbom = {
              'bomFormat': 'CycloneDX',
              'specVersion': '1.4',
              'version': 1,
              'metadata': {
                  'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
                  'component': {
                      'type': 'application',
                      'name': 'Phantom32-CI-tooling',
                      'version': '3.2.0',
                      'description': 'CI Python tooling environment (not firmware dependencies)'
                  }
              },
              'components': components
          }
          json.dump(sbom, open('sbom-ci.json', 'w'), indent=2)
          print(f'Generated SBOM with {len(components)} components.')
          "

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom-ci.json
          retention-days: 90

  # ----------------------------------------------------------------
  # Job 2: Static analysis + formatting
  # ----------------------------------------------------------------
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check clang-format compliance
        run: |
          sudo apt-get install -y --no-install-recommends clang-format
          find src/ -name "*.cpp" -o -name "*.h" | sort > /tmp/src_files.txt
          errors=0
          while IFS= read -r f; do
            diff_out=$(clang-format --dry-run --Werror "$f" 2>&1 || true)
            if [ -n "$diff_out" ]; then
              echo "FORMAT: $f needs reformatting"
              errors=$((errors + 1))
            fi
          done < /tmp/src_files.txt
          if [ "$errors" -gt 0 ]; then
            echo "ERROR: $errors file(s) are not clang-format compliant." >&2
            echo "Run: clang-format -i src/*.h src/*.cpp" >&2
            exit 1
          fi
          echo "OK: All source files pass clang-format."

      - name: Check for hardcoded AP password in non-define contexts
        run: |
          if grep -rn '"phantom32"' src/ \
               | grep -v '#define\|//\|ap-default\|placeholder='; then
            echo "ERROR: Hardcoded AP password found in an unexpected context." >&2
            exit 1
          fi
          echo "OK: No unexpected hardcoded passwords."

      - name: Reject -Wl,-zmuldefs (duplicate-symbol suppressor)
        run: |
          if grep -q "zmuldefs" platformio.ini; then
            echo "ERROR: -Wl,-zmuldefs found in platformio.ini." >&2
            exit 1
          fi
          echo "OK: -Wl,-zmuldefs is not present."

      - name: Check for security-critical TODO/FIXME/HACK comments
        run: |
          found=$(grep -rn "TODO.*auth\|FIXME.*auth\|TODO.*security\|FIXME.*security\|HACK\|XXX" src/ || true)
          if [ -n "$found" ]; then
            echo "WARN: Unresolved security-related TODO/FIXME/HACK items:"
            echo "$found"
          else
            echo "OK: No pending security TODOs."
          fi

      - name: Verify PHANTOM32_LITE/PSRAM coverage (all 13 envs)
        run: |
          python3 - <<'EOF'
          import configparser, sys

          cfg = configparser.ConfigParser()
          cfg.read('platformio.ini')

          missing = []
          skip = {'native', 'native_asan', 'native_cov'}
          for section in cfg.sections():
              if not section.startswith('env:') or section == 'env':
                  continue
              env = section[4:]
              if env in skip:
                  continue
              flags = (cfg.get(section, 'build_flags', fallback='') +
                       cfg.get('env', 'build_flags', fallback=''))
              has_psram = 'BOARD_HAS_PSRAM' in flags
              has_lite  = 'PHANTOM32_LITE' in flags
              if not has_psram and not has_lite:
                  missing.append(env)

          if missing:
              print('ERROR: These environments have neither BOARD_HAS_PSRAM nor PHANTOM32_LITE:')
              for e in missing:
                  print(' ', e)
              sys.exit(1)
          else:
              print(f'OK: All environments have PSRAM or LITE flag.')
          EOF

      - name: Check all 16 sensitive routes have auth guards
        run: |
          python3 - <<'EOF'
          import re, sys

          with open('src/main.cpp') as f:
              main_content = f.read()
          with open('src/safety.h') as f:
              safety_content = f.read()

          checks = [
              (main_content, '/api/reboot'),
              (main_content, '/api/fs/format'),
              (main_content, '/api/fs/info'),
              (main_content, '/api/wifi/channel'),
              (main_content, '/api/promisc'),
              (main_content, '/api/ext/toggle'),
              (main_content, '/api/reset/stats'),
              (main_content, '/api/hop'),
              (main_content, '/api/sys'),
              (main_content, '/api/modules'),
              (main_content, '/api/scan'),
              (main_content, '/dashboard'),
              (safety_content, '/api/safety/get'),
              (safety_content, '/api/safety/set'),
              (safety_content, '/api/safety/block'),
              (safety_content, '/api/safety/unblock'),
          ]

          failures = []
          for content, route in checks:
              pat = re.compile(
                  r'server\.on\s*\(\s*"' + re.escape(route) + r'".*?(?=server\.on|\Z)',
                  re.DOTALL)
              m = pat.search(content)
              if not m:
                  failures.append(f'MISSING: {route}')
                  continue
              if 'auth_check' not in m.group(0):
                  failures.append(f'UNGUARDED: {route}')

          if failures:
              print('Authentication audit FAILED:')
              for f in failures:
                  print(' ', f)
              sys.exit(1)
          else:
              print(f'OK: All {len(checks)} sensitive routes have auth guards.')
          EOF

      - name: Cross-check route inventory against source
        run: |
          python3 scripts/audit_routes.py

  # ----------------------------------------------------------------
  # Job 3: Firmware build matrix
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.env }}
    needs: [ native-tests, native-sanitizers, lint, secret-scan ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env:
          # Non-PSRAM boards (PHANTOM32_LITE)
          - doom
          - doom_nodemcu
          - doom_m5stack
          - doom_m5core2
          - doom_ttgo
          - doom_tcall
          - doom_heltec
          # PSRAM boards (full analytics)
          - doom_wrover
          - doom_s3
          - doom_tdisplay_s3
          - doom_m5cores3
          # C3 (RISC-V, PHANTOM32_LITE)
          - doom_c3
          # S3 DevKitC-1 (unknown PSRAM variant, PHANTOM32_LITE)
          - doom_s3_devkit

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: |
            pio-${{ matrix.env }}-
            pio-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Report and enforce memory budgets
        if: always()
        run: |
          echo "=== Memory report: ${{ matrix.env }} ==="
          mem_output=$(pio run -e ${{ matrix.env }} 2>&1 \
            | grep -E "RAM:|Flash:|DRAM:|IRAM:|DATA:|BSS:|Used static|RAM regions" || true)
          echo "$mem_output"

          # Enforce RAM budget (≤ 85% DRAM).
          ram_pct=$(pio run -e ${{ matrix.env }} 2>&1 \
                    | grep -oE "RAM.*[0-9]+\.[0-9]+%" | grep -oE "[0-9]+\.[0-9]+" | head -1)
          if [ -n "$ram_pct" ]; then
            echo "RAM usage: ${ram_pct}%"
            over=$(echo "$ram_pct > 85" | bc -l 2>/dev/null || echo 0)
            if [ "$over" = "1" ]; then
              echo "ERROR: RAM usage ${ram_pct}% exceeds 85% budget." >&2
              exit 1
            fi
          fi

          # Enforce Flash budget (≤ 90% for LITE builds, ≤ 96% for PSRAM builds).
          # PSRAM builds (doom_wrover, doom_s3*) include all 13 analytics modules
          # and legitimately use more flash; 96% is their documented budget ceiling.
          flash_pct=$(pio run -e ${{ matrix.env }} 2>&1 \
                      | grep -oE "Flash.*[0-9]+\.[0-9]+%" | grep -oE "[0-9]+\.[0-9]+" | head -1)
          if [ -n "$flash_pct" ]; then
            env_name="${{ matrix.env }}"
            if [[ "$env_name" == *"wrover"* ]] || [[ "$env_name" == *"s3"* ]]; then
              flash_limit=96
            else
              flash_limit=90
            fi
            echo "Flash usage: ${flash_pct}%  (limit: ${flash_limit}%)"
            over=$(echo "$flash_pct > $flash_limit" | bc -l 2>/dev/null || echo 0)
            if [ "$over" = "1" ]; then
              echo "ERROR: Flash usage ${flash_pct}% exceeds ${flash_limit}% budget for $env_name." >&2
              exit 1
            fi
          fi

      - name: Collect firmware artifacts
        if: success()
        run: |
          mkdir -p artifacts/${{ matrix.env }}
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true
          cp .pio/build/${{ matrix.env }}/partitions.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true
          cp .pio/build/${{ matrix.env }}/bootloader.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true
          sha256sum artifacts/${{ matrix.env }}/*.bin \
            > artifacts/${{ matrix.env }}/SHA256SUMS.txt 2>/dev/null || true
          cat > artifacts/${{ matrix.env }}/BUILD_MANIFEST.json <<EOF
          {
            "project": "Phantom32",
            "version": "3.2.0",
            "build_env": "${{ matrix.env }}",
            "git_commit": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "runner_os": "${{ runner.os }}",
            "pio_version": "${{ env.PIO_VERSION }}",
            "built_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow_run": "${{ github.run_id }}/${{ github.run_number }}"
          }
          EOF

      - name: Upload firmware artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phantom32-${{ matrix.env }}-${{ github.sha }}
          path: artifacts/${{ matrix.env }}/
          retention-days: 30

  # ----------------------------------------------------------------
  # Job 4: Build summary (requires all board builds to pass)
  # ----------------------------------------------------------------
  build-summary:
    name: All builds passed
    needs: [ build, native-coverage ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check result
        run: |
          build_ok="${{ needs.build.result }}"
          cov_ok="${{ needs.native-coverage.result }}"
          echo "Board builds: $build_ok"
          echo "Coverage job: $cov_ok"
          if [ "$build_ok" != "success" ]; then
            echo "One or more board builds failed." >&2
            exit 1
          fi
          if [ "$cov_ok" != "success" ]; then
            echo "Coverage job failed — thresholds not met or report not generated." >&2
            exit 1
          fi
          echo "All 13 board builds passed and coverage thresholds met."

  # ----------------------------------------------------------------
  # Job 5: Compatibility matrix — generate pass/fail artifact
  # ----------------------------------------------------------------
  compatibility-matrix:
    name: Compatibility matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    permissions:
      contents: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build_results/
          pattern: phantom32-*
          merge-multiple: false

      - name: Generate compatibility matrix
        run: |
          declare -A BOARDS=(
            [doom]="ESP32-WROOM-32D   | LITE  | ESP32"
            [doom_nodemcu]="NodeMCU-32S    | LITE  | ESP32"
            [doom_m5stack]="M5Stack Basic  | LITE  | ESP32"
            [doom_m5core2]="M5Stack Core2  | LITE  | ESP32"
            [doom_ttgo]="TTGO T-Display | LITE  | ESP32"
            [doom_tcall]="TTGO T-Call    | LITE  | ESP32"
            [doom_heltec]="Heltec Kit 32  | LITE  | ESP32"
            [doom_s3_devkit]="ESP32-S3 DevKitC | LITE | ESP32-S3"
            [doom_c3]="ESP32-C3 DevKit | LITE  | ESP32-C3"
            [doom_wrover]="ESP-WROVER-KIT | PSRAM | ESP32"
            [doom_s3]="XIAO ESP32-S3  | PSRAM | ESP32-S3"
            [doom_tdisplay_s3]="T-Display S3  | PSRAM | ESP32-S3"
            [doom_m5cores3]="M5Stack CoreS3 | PSRAM | ESP32-S3"
          )

          echo "# Compatibility Matrix" > matrix.md
          echo "" >> matrix.md
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")  " >> matrix.md
          echo "Commit: \`${{ github.sha }}\`  " >> matrix.md
          echo "" >> matrix.md
          echo "| Board | Tier | Chip | Build |" >> matrix.md
          echo "|-------|------|------|-------|" >> matrix.md

          PASS=0; FAIL=0
          for env in doom doom_nodemcu doom_m5stack doom_m5core2 doom_ttgo doom_tcall doom_heltec doom_s3_devkit doom_c3 doom_wrover doom_s3 doom_tdisplay_s3 doom_m5cores3; do
            info="${BOARDS[$env]}"
            # Check if the artifact directory (and firmware.bin) exists
            if ls build_results/phantom32-${env}-*/firmware.bin >/dev/null 2>&1; then
              status="✅ Pass"
              PASS=$((PASS+1))
            else
              status="❌ Fail"
              FAIL=$((FAIL+1))
            fi
            echo "| ${info} | ${status} |" >> matrix.md
          done

          echo "" >> matrix.md
          echo "**${PASS}/13 passed, ${FAIL} failed**" >> matrix.md
          cat matrix.md

          # Also emit JSON for tooling
          python3 - <<'PYEOF'
          import json, os, glob
          boards = ["doom","doom_nodemcu","doom_m5stack","doom_m5core2","doom_ttgo",
                    "doom_tcall","doom_heltec","doom_s3_devkit","doom_c3",
                    "doom_wrover","doom_s3","doom_tdisplay_s3","doom_m5cores3"]
          results = {}
          for b in boards:
              matches = glob.glob(f"build_results/phantom32-{b}-*/firmware.bin")
              results[b] = "pass" if matches else "fail"
          print(json.dumps({"boards": results}, indent=2))
          with open("matrix.json", "w") as f:
              json.dump({"boards": results}, f, indent=2)
          PYEOF

      - name: Upload compatibility matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: compatibility-matrix
          path: |
            matrix.md
            matrix.json
          retention-days: 90
