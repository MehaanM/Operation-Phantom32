name: Phantom32 CI

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_VERSION: "6.1.16"

jobs:
  # ----------------------------------------------------------------
  # Job 1: Native unit tests (fastest; run first to catch regressions)
  # ----------------------------------------------------------------
  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-native-${{ hashFiles('platformio.ini') }}-v2
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Install GCC (native build toolchain)
        run: sudo apt-get install -y --no-install-recommends gcc g++ make

      - name: Run unit tests
        run: pio test -e native --verbose

  # ----------------------------------------------------------------
  # Job 2: Static analysis (no compiler needed, runs fast)
  # ----------------------------------------------------------------
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for hardcoded AP password in non-define contexts
        run: |
          if grep -rn '"phantom32"' src/ \
               | grep -v 'AP_PASSWORD\s*=\|//\|#define'; then
            echo "ERROR: Hardcoded AP password found outside AP_PASSWORD define." >&2
            exit 1
          fi
          echo "OK: No hardcoded passwords."

      - name: Check for -Wl,-zmuldefs (linker duplicate-symbol suppressor)
        run: |
          if grep -q "zmuldefs" platformio.ini; then
            echo "WARN: -Wl,-zmuldefs is set."
            echo "This suppresses duplicate-symbol linker errors, which can mask real bugs."
            echo "Verify no unintentional duplicate definitions are hidden by this flag."
          fi

      - name: Check for security-critical TODO/FIXME/HACK comments
        run: |
          found=$(grep -rn "TODO.*auth\|FIXME.*auth\|TODO.*security\|FIXME.*security\|HACK\|XXX" src/ || true)
          if [ -n "$found" ]; then
            echo "WARN: Unresolved security-related TODO/FIXME/HACK items:"
            echo "$found"
          else
            echo "OK: No pending security TODOs."
          fi

      - name: Check all sensitive routes have auth guards
        run: |
          python3 - <<'EOF'
          import re, sys

          with open('src/main.cpp') as f:
              content = f.read()

          # Routes that MUST be auth-guarded (not captive portal redirects).
          must_guard = [
              '/api/reboot',
              '/api/fs/format',
              '/api/fs/info',
              '/api/wifi/channel',
              '/api/promisc',
              '/api/ext/toggle',
              '/api/reset/stats',
              '/api/hop',
              '/api/sys',
              '/api/modules',
              '/api/scan',
              '/dashboard',
          ]

          failures = []
          for route in must_guard:
              # Find the server.on block for this route.
              pattern = re.compile(
                  r'server\.on\s*\(\s*"' + re.escape(route) + r'".*?(?=server\.on|\Z)',
                  re.DOTALL
              )
              match = pattern.search(content)
              if not match:
                  failures.append(f'MISSING route: {route}')
                  continue
              block = match.group(0)
              if 'auth_check' not in block:
                  failures.append(f'UNGUARDED: {route}')

          if failures:
              print('Authentication audit FAILED:')
              for f in failures:
                  print(' ', f)
              sys.exit(1)
          else:
              print(f'OK: All {len(must_guard)} sensitive routes have auth guards.')
          EOF

      - name: Verify PHANTOM32_LITE/PSRAM coverage
        run: |
          python3 - <<'EOF'
          import configparser, sys

          cfg = configparser.ConfigParser()
          cfg.read('platformio.ini')

          missing = []
          for section in cfg.sections():
              if not section.startswith('env:') or section == 'env':
                  continue
              env = section[4:]
              if env in ('native',):
                  continue  # skip test env
              flags = (cfg.get(section, 'build_flags', fallback='') +
                       cfg.get('env', 'build_flags', fallback=''))
              has_psram = 'BOARD_HAS_PSRAM' in flags
              has_lite  = 'PHANTOM32_LITE' in flags
              if not has_psram and not has_lite:
                  missing.append(env)

          if missing:
              print('ERROR: These environments have neither BOARD_HAS_PSRAM nor PHANTOM32_LITE:')
              for e in missing:
                  print(' ', e)
              sys.exit(1)
          else:
              print('OK: All environments have PSRAM or LITE flag.')
          EOF

  # ----------------------------------------------------------------
  # Job 3: Firmware build matrix
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.env }}
    needs: [ native-tests, lint ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          # Non-PSRAM boards (PHANTOM32_LITE)
          - doom
          - doom_nodemcu
          - doom_m5stack
          - doom_m5core2
          - doom_ttgo
          - doom_tcall
          - doom_heltec
          # PSRAM boards (full analytics)
          - doom_wrover
          - doom_s3
          - doom_s3_devkit
          - doom_tdisplay_s3
          - doom_m5cores3
          # C3 (RISC-V)
          - doom_c3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}-v2
          restore-keys: |
            pio-${{ matrix.env }}-
            pio-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Report RAM and Flash usage
        if: always()
        run: |
          echo "=== Memory report: ${{ matrix.env }} ==="
          pio run -e ${{ matrix.env }} 2>&1 \
            | grep -E "RAM:|Flash:|DRAM:|IRAM:|DATA:|BSS:" \
            || echo "(no memory lines found)"

      - name: Collect firmware artifacts
        if: success()
        run: |
          mkdir -p artifacts/${{ matrix.env }}
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true
          cp .pio/build/${{ matrix.env }}/partitions.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true
          cp .pio/build/${{ matrix.env }}/bootloader.bin \
             artifacts/${{ matrix.env }}/ 2>/dev/null || true

      - name: Upload firmware artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: phantom32-${{ matrix.env }}-${{ github.sha }}
          path: artifacts/${{ matrix.env }}/
          retention-days: 30

  # ----------------------------------------------------------------
  # Job 4: Build summary (requires all board builds to pass)
  # ----------------------------------------------------------------
  build-summary:
    name: All builds passed
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check result
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All 13 board builds passed."
          else
            echo "One or more board builds failed. See the build matrix above." >&2
            exit 1
          fi
