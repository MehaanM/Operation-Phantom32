name: Deploy Web Flasher

# Deploys website/ to GitHub Pages on every push to main or workflow_dispatch.
# Firmware binaries are downloaded from the latest GitHub Release and bundled
# into website/firmware/ so they are served same-origin (no CORS issues).
# The live URL is: https://mehaanm.github.io/Operation-Phantom32/

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download latest firmware binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/firmware
          # Download all .bin files from the latest release into website/firmware/
          gh release download --repo MehaanM/Operation-Phantom32 \
            --pattern '*.bin' \
            --dir website/firmware \
            --clobber || echo "No release found yet — deploying without firmware binaries"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: website/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
