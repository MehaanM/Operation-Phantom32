name: Release

# Triggered by pushing a version tag (e.g. git tag v3.2.0 && git push origin v3.2.0).
# Builds all 13 boards and publishes a GitHub Release with all firmware binaries.
# The web flasher at website/index.html fetches binaries from releases/latest/download/.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PIO_VERSION: "6.2.0"

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build all boards in parallel, upload binaries as artifacts
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env:
          # Non-PSRAM boards (PHANTOM32_LITE)
          - doom
          - doom_nodemcu
          - doom_m5stack
          - doom_m5core2
          - doom_ttgo
          - doom_tcall
          - doom_heltec
          # PSRAM boards (full analytics)
          - doom_wrover
          - doom_s3
          - doom_tdisplay_s3
          - doom_m5cores3
          # C3 (RISC-V, PHANTOM32_LITE)
          - doom_c3
          # S3 DevKitC-1 (unknown PSRAM variant, PHANTOM32_LITE)
          - doom_s3_devkit

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: |
            pio-${{ matrix.env }}-
            pio-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Rename firmware to web-flasher convention
        # The web flasher (website/index.html) fetches:
        #   firmware_<id>.bin, firmware_<id>_bootloader.bin, firmware_<id>_partitions.bin
        run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             dist/firmware_${{ matrix.env }}.bin
          cp .pio/build/${{ matrix.env }}/bootloader.bin \
             dist/firmware_${{ matrix.env }}_bootloader.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin \
             dist/firmware_${{ matrix.env }}_partitions.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------
  # Job 2: Collect all boards' binaries and publish the GitHub Release
  # ----------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: firmware-all/
          pattern: firmware-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd firmware-all
          sha256sum *.bin > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: List release assets
        run: ls -lh firmware-all/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" \
            --title "Phantom32 ${tag}" \
            --notes "## Phantom32 ${tag}

          ### Flash from browser
          Use the [Phantom32 web flasher](https://github.com/MehaanM/Operation-Phantom32) to
          flash any supported ESP32 board directly from Chrome or Edge — no drivers, no IDE.

          ### Included boards (13 total)
          | Board ID | Chip | Variant |
          |---|---|---|
          | \`doom\` | ESP32 | Generic / WROOM-32 |
          | \`doom_nodemcu\` | ESP32 | NodeMCU-32S |
          | \`doom_m5stack\` | ESP32 | M5Stack Basic / Gray |
          | \`doom_m5core2\` | ESP32 | M5Stack Core2 |
          | \`doom_ttgo\` | ESP32 | TTGO T-Display |
          | \`doom_tcall\` | ESP32 | TTGO T-Call SIM800L |
          | \`doom_heltec\` | ESP32 | Heltec WiFi Kit 32 |
          | \`doom_wrover\` | ESP32 | ESP-WROVER-KIT (8 MB PSRAM) |
          | \`doom_s3\` | ESP32-S3 | XIAO ESP32-S3 (8 MB PSRAM) |
          | \`doom_tdisplay_s3\` | ESP32-S3 | T-Display-S3 (8 MB PSRAM) |
          | \`doom_m5cores3\` | ESP32-S3 | M5Stack CoreS3 (8 MB PSRAM) |
          | \`doom_c3\` | ESP32-C3 | C3 DevKit (RISC-V) |
          | \`doom_s3_devkit\` | ESP32-S3 | ESP32-S3 DevKitC-1 |

          ### File naming
          Each board ships three files:
          - \`firmware_<board>.bin\` — application firmware
          - \`firmware_<board>_bootloader.bin\` — bootloader
          - \`firmware_<board>_partitions.bin\` — partition table

          ### Verification
          \`\`\`
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          **FOR AUTHORIZED USE IN ENVIRONMENTS YOU OWN OR HAVE WRITTEN PERMISSION TO TEST.**" \
            firmware-all/*.bin firmware-all/SHA256SUMS.txt
