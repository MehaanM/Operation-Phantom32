name: Release

on:
  push:
    tags:
      - 'v*'

# Write access is needed to create the release and upload assets.
permissions:
  contents: write

env:
  PIO_VERSION: "6.2.0"

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build all 13 firmware environments in parallel
  # ----------------------------------------------------------------
  build-firmware:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env:
          - doom
          - doom_nodemcu
          - doom_m5stack
          - doom_m5core2
          - doom_ttgo
          - doom_tcall
          - doom_heltec
          - doom_wrover
          - doom_s3
          - doom_tdisplay_s3
          - doom_m5cores3
          - doom_c3
          - doom_s3_devkit

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}-v4
          restore-keys: |
            pio-${{ matrix.env }}-
            pio-

      - name: Install PlatformIO
        run: pip install "platformio==${{ env.PIO_VERSION }}"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Collect and rename firmware binaries
        run: |
          ENV="${{ matrix.env }}"
          mkdir -p firmware_out

          # Rename to the flat names the web flasher manifests expect:
          #   firmware_<env>.bin
          #   firmware_<env>_bootloader.bin
          #   firmware_<env>_partitions.bin
          cp ".pio/build/${ENV}/firmware.bin"    "firmware_out/firmware_${ENV}.bin"
          cp ".pio/build/${ENV}/bootloader.bin"  "firmware_out/firmware_${ENV}_bootloader.bin"
          cp ".pio/build/${ENV}/partitions.bin"  "firmware_out/firmware_${ENV}_partitions.bin"

          sha256sum firmware_out/*.bin > "firmware_out/firmware_${ENV}_SHA256SUMS.txt"
          echo "Built:"
          ls -lh firmware_out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware_out/
          retention-days: 1

  # ----------------------------------------------------------------
  # Job 2: Gather all binaries and publish a GitHub Release
  # ----------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    needs: build-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout (for tag metadata)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_firmware/
          pattern: firmware-*
          merge-multiple: true

      - name: List collected files
        run: |
          echo "Files to upload:"
          ls -lh all_firmware/*.bin | sort

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.version }}"
          cat > release_notes.md <<EOF
          ## Phantom32 ${TAG}

          Flash any of the 13 supported ESP32 boards directly from your browser at the
          [operationphantom32 web flasher](https://operationphantom32.pages.dev) — no drivers, no IDE required.

          ### Supported boards
          | Build | Environment | Chip |
          |-------|-------------|------|
          | LITE  | doom | ESP32 (WROOM-32D) |
          | LITE  | doom_nodemcu | ESP32 (NodeMCU-32S) |
          | LITE  | doom_m5stack | ESP32 (M5Stack Basic) |
          | LITE  | doom_m5core2 | ESP32 (M5Stack Core2) |
          | LITE  | doom_ttgo | ESP32 (TTGO T-Display) |
          | LITE  | doom_tcall | ESP32 (TTGO T-Call) |
          | LITE  | doom_heltec | ESP32 (Heltec WiFi Kit 32) |
          | LITE  | doom_s3_devkit | ESP32-S3 (DevKitC-1) |
          | LITE  | doom_c3 | ESP32-C3 (RISC-V DevKit) |
          | PSRAM | doom_wrover | ESP32 (WROVER-B/IB) |
          | PSRAM | doom_s3 | ESP32-S3 (XIAO S3) |
          | PSRAM | doom_tdisplay_s3 | ESP32-S3 (T-Display S3) |
          | PSRAM | doom_m5cores3 | ESP32-S3 (M5Stack CoreS3) |

          ### Manual flashing
          Each environment ships three files:
          - \`firmware_<env>_bootloader.bin\`  → offset \`0x1000\` (ESP32) or \`0x0\` (S3/C3)
          - \`firmware_<env>_partitions.bin\`  → offset \`0x8000\`
          - \`firmware_<env>.bin\`             → offset \`0x10000\`

          \`\`\`bash
          esptool.py --chip esp32 write_flash \\
            0x1000  firmware_doom_bootloader.bin \\
            0x8000  firmware_doom_partitions.bin \\
            0x10000 firmware_doom.bin
          \`\`\`

          ### SHA-256 checksums
          Per-environment \`SHA256SUMS.txt\` files are included in this release.
          EOF

      - name: Create GitHub Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Phantom32 ${TAG}" \
            --notes-file release_notes.md \
            all_firmware/*.bin \
            all_firmware/*_SHA256SUMS.txt

          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
