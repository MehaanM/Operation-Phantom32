[platformio]
default_envs = doom_s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.filesystem = littlefs
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -Os
  -Wl,--wrap=ieee80211_raw_frame_sanity_check
  -Wl,-Map,.pio/build/${PIOENV}/memory.map

# ─── ESP32 (Xtensa LX6, dual-core, BLE+WiFi) ─────────────────────────────────

# Generic ESP32 DevKit / ESP32-WROOM-32 / WROOM-32D / WROOM-32U
[env:doom]
platform  = espressif32@6.5.0
board     = esp32doit-devkit-v1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
build_flags =
  ${env.build_flags}
  -DPHANTOM32_LITE

