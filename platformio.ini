# ─── Native (host) — unit tests only ────────────────────────────────────────

# Standard native test run (no instrumentation — fastest).
[env:native]
platform = native
test_framework = unity
# Override the global [env] section so Arduino framework and ESP32 libs
# are not inherited by the host-side test build.
framework =
lib_deps =
build_flags =
  -std=gnu++14
  -DNATIVE_ENV
  -DPHANTOM32_NATIVE_TEST
  -DUNITY_INCLUDE_PRINT_FORMATTED
  -Wall
  -Wextra
  -Wno-unused-parameter
test_filter = test_*

# Sanitizer build: AddressSanitizer + UndefinedBehaviorSanitizer.
# Run with: pio test -e native_asan
[env:native_asan]
platform = native
test_framework = unity
framework =
lib_deps =
build_flags =
  -std=gnu++14
  -DNATIVE_ENV
  -DPHANTOM32_NATIVE_TEST
  -DUNITY_INCLUDE_PRINT_FORMATTED
  -Wall
  -Wextra
  -Wno-unused-parameter
  -Werror
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -g
  -O1
test_filter = test_*

# Coverage build: gcov line and branch coverage.
# Run with: pio test -e native_cov  then generate report with scripts/coverage.sh
[env:native_cov]
platform = native
test_framework = unity
framework =
lib_deps =
extra_scripts = scripts/coverage_link.py
build_flags =
  -std=gnu++14
  -DNATIVE_ENV
  -DPHANTOM32_NATIVE_TEST
  -DUNITY_INCLUDE_PRINT_FORMATTED
  --coverage
  -fprofile-arcs
  -ftest-coverage
  -g
  -O0
test_filter = test_*
