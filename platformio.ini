build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

# Generic ESP32-S3 DevKitC-1 (8 MB flash, N8 variant — no guaranteed PSRAM)
# Use doom_s3 (Seeed XIAO S3) or doom_m5cores3 for PSRAM-backed builds.
# DevKitC-1 ships as N8, N8R2, or N8R8; we cannot guarantee PSRAM at
# compile time, so PHANTOM32_LITE is the safe default.
