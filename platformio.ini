[platformio]
default_envs = doom_s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.filesystem = littlefs
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wl,-zmuldefs
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -Os

# ─── ESP32 (Xtensa LX6, dual-core, BLE+WiFi) ─────────────────────────────────

# Generic ESP32 DevKit / ESP32-WROOM-32 / WROOM-32D / WROOM-32U
[env:doom]
platform  = espressif32@6.5.0
board     = esp32doit-devkit-v1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# NodeMCU-32S (same die as WROOM, different USB chip)
[env:doom_nodemcu]
platform  = espressif32@6.5.0
board     = nodemcu-32s
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# ESP32-WROVER / WROVER-B (extra 4–8 MB PSRAM, same flash layout)
[env:doom_wrover]
platform  = espressif32@6.5.0
board     = esp32-wrover-kit
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM

# M5Stack Basic / Gray / Fire (ESP32, 4–16 MB flash, LCD)
[env:doom_m5stack]
platform  = espressif32@6.5.0
board     = m5stack-core-esp32
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# M5Stack Core2 (ESP32, 16 MB flash, touch LCD, AXP192 PMU)
[env:doom_m5core2]
platform  = espressif32@6.5.0
board     = m5stack-core2
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB

# TTGO T-Display (ESP32, 4 MB flash, 1.14" TFT)
[env:doom_ttgo]
platform  = espressif32@6.5.0
board     = ttgo-t1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# TTGO T-Call (ESP32 + SIM800L modem, 4 MB flash)
[env:doom_tcall]
platform  = espressif32@6.5.0
board     = esp32doit-devkit-v1
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# Heltec WiFi Kit 32 (ESP32, OLED, 4 MB flash)
[env:doom_heltec]
platform  = espressif32@6.5.0
board     = heltec_wifi_kit_32
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

# ─── ESP32-S3 (Xtensa LX7, dual-core, BLE5+WiFi, USB OTG) ───────────────────

# Seeed XIAO ESP32-S3 (8 MB flash, PSRAM) — primary dev board
[env:doom_s3]
platform  = espressif32@6.5.0
board     = seeed_xiao_esp32s3
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 8MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

# Generic ESP32-S3 DevKitC-1 (8 MB flash)
[env:doom_s3_devkit]
platform  = espressif32@6.5.0
board     = esp32-s3-devkitc-1
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 8MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

# Lilygo T-Display-S3 (ESP32-S3, 16 MB flash, 1.9" TFT)
[env:doom_tdisplay_s3]
platform  = espressif32@6.5.0
board     = lilygo-t-display-s3
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

# M5Stack CoreS3 (ESP32-S3, 16 MB flash, 2" touch LCD)
[env:doom_m5cores3]
platform  = espressif32@6.5.0
board     = m5stack-cores3
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM

# ─── ESP32-C3 (RISC-V, single-core, BLE5+WiFi, USB CDC built-in) ─────────────
# Note: raw 802.11 inject works via same bypass patch; BLE via NimBLE
# Requires RISC-V toolchain (riscv32-esp). On Apple Silicon: install Rosetta or
# use a Linux cross-compile host. Code is correct; toolchain install issue only.
[env:doom_c3]
platform  = espressif32@6.5.0
board     = seeed_xiao_esp32c3
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
